name: CI

# Thin stub — the gate and steps live in chrischall/workflows.
# Status-mode gate: un-armed PRs are blocked by a yellow `ci-gated: pending`
# commit status (the `ci / ci` job is skipped, not a red or misleadingly green
# job); the repo ruleset must require the `ci-gated` status context
# (scripts/update-ruleset.sh flips it from `ci / ci`).
# The permissions block is load-bearing: the reusable workflow posts the
# `ci-gated` status with this token, and (a) callers pass read-only by default,
# (b) dependabot-triggered runs are read-only unless permissions are explicit.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Push runs are never gated: main is built and tested on every merge.
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  ci:
    uses: chrischall/workflows/.github/workflows/reusable-mcp-ci.yml@main
    with:
      node-version: '26'
      build-command: npm run build
      test-command: npm run typecheck && npm test
      gate-mode: status

  # Canary against fetchproxy's unreleased protocol. `@fetchproxy/protocol` is
  # an ordinary npm dependency here, and protocol changes land in
  # chrischall/fetchproxy first and ship on its `next` prerelease channel — so
  # this job swaps the locked version for `@next` and runs the suite, and a
  # protocol change that would break the bridge shows red HERE before it is
  # released. When fetchproxy has no `next` dist-tag (between prereleases) it
  # falls back to `latest` and says so, rather than failing.
  #
  # Not part of the `ci-gated` gate and not a required check: it reports on
  # someone else's unreleased code, so it must not block this repo's merges.
  # Skipped on `labeled` events, which re-run the gate but change no code.
  protocol-next:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      # Pins ALL THREE workspaces' range (extension-core, extension-chrome,
      # extension-safari) to the exact version and re-resolves, so
      # a `next` outside `^3.x` (a new protocol major) cannot leave a nested
      # 3.x copy that the suite would silently keep testing against. The
      # rewritten package.json / lockfile live only in this runner.
      - name: Install @fetchproxy/protocol@next (fallback latest)
        run: |
          set -euo pipefail
          VERSION=$(npm view @fetchproxy/protocol dist-tags.next 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            echo "Testing against @fetchproxy/protocol@next = ${VERSION}"
          else
            VERSION=$(npm view @fetchproxy/protocol dist-tags.latest)
            echo "::notice::@fetchproxy/protocol has no next dist-tag; falling back to latest = ${VERSION}"
          fi
          npm pkg set "dependencies.@fetchproxy/protocol=${VERSION}" \
            -w @fetchproxy/extension-core -w @fetchproxy/extension-chrome \
            -w @fetchproxy/extension-safari
          npm install --no-audit --no-fund --ignore-scripts
          RESOLVED=$(npm ls @fetchproxy/protocol --all --json | node -e '
            const seen = new Set();
            const walk = (n) => {
              for (const [name, dep] of Object.entries(n.dependencies ?? {})) {
                if (name === "@fetchproxy/protocol") seen.add(dep.version);
                walk(dep);
              }
            };
            walk(JSON.parse(require("fs").readFileSync(0, "utf8")));
            console.log([...seen].join(" "));
          ')
          if [ "$RESOLVED" != "$VERSION" ]; then
            echo "::error::expected only @fetchproxy/protocol@${VERSION} in the tree, found: ${RESOLVED}" >&2
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

  # Does this PR need the unsigned Apple build below? Decided on a hosted
  # runner from the PR's file list (.github/scripts/apple-build-paths.sh, tested
  # by tests/ci-apple-build.test.ts), so a PR that cannot change the container
  # never queues for the shared Mac. PRs only: main is not rebuilt on merge,
  # and a label changes no code.
  #
  # Same-repo PRs only. This repo is PUBLIC and the Mac below is the org's
  # shared, non-ephemeral runner that also does every nullnet signed release
  # job, so a fork PR's code (npm ci, stage-extension.sh, project.yml's build
  # phases) must never run there, whatever the fork-PR approval policy says.
  # GitHub advises against self-hosted runners on public repos for this reason.
  apple-changes:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'labeled'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          APPLE=$(sh .github/scripts/apple-build-paths.sh < "$RUNNER_TEMP/files.txt")
          echo "apple=$APPLE" >> "$GITHUB_OUTPUT"
          echo "Unsigned Apple build needed: $APPLE"

  # The Safari container app (apple/), built UNSIGNED on PRs that touch it:
  # plan docs/superpowers/plans/2026-10-05-safari-extension-standalone.md,
  # Task 4. It proves the project generates, compiles and stages the extension
  # into both appexes; it cannot prove the extension runs (Safari never runs an
  # ad-hoc-signed extension).
  #
  # NOT a required check, and not part of the `ci-gated` gate: it runs on the
  # org's ONE self-hosted Mac, shared by every nullnet repo's Apple work, so it
  # must never hold this repo's merges hostage to that queue. The required
  # check stays `ci / ci`.
  #
  # The runner must be in a runner group that allows PUBLIC repositories (not
  # the default) or this job queues until GitHub expires it 24h later. The
  # same-repo guard (on apple-changes, and repeated here) must stay in place
  # before that group is opened to this repo.
  #
  # That Mac is not ephemeral, so: Xcode is selected with DEVELOPER_DIR for
  # this job only (never `sudo xcode-select`), builds go to a job-local
  # DerivedData, and the last step removes it whatever happened.
  apple:
    needs: apple-changes
    if: needs.apple-changes.outputs.apple == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    # Caps the run, not the wait for the Mac.
    timeout-minutes: 45
    permissions:
      contents: read
    # A newer push to the same PR supersedes this build; don't spend the
    # shared Mac finishing a stale one.
    concurrency:
      group: apple-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm

      # The appex's pre-build phase (apple/tools/stage-extension.sh) runs the
      # extension-safari build from this tree, so it needs the workspaces'
      # dependencies, and nothing else.
      - run: npm ci --ignore-scripts

      - name: Ensure xcodegen
        run: |
          set -euo pipefail
          # The runner's PATH need not include Homebrew's prefix.
          if [ -d /opt/homebrew/bin ]; then
            export PATH="/opt/homebrew/bin:$PATH"
            echo /opt/homebrew/bin >> "$GITHUB_PATH"
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build the macOS app (unsigned)
        working-directory: apple
        run: |
          set -euo pipefail
          xcodebuild -project ContextMintBridge.xcodeproj -scheme ContextMintBridgeMac \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build the iOS app (unsigned, simulator)
        working-directory: apple
        run: |
          set -euo pipefail
          xcodebuild -project ContextMintBridge.xcodeproj -scheme ContextMintBridgeIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build CODE_SIGNING_ALLOWED=NO

      # Task 1's "Done when": each built appex has manifest.json at its
      # resources root (Contents/Resources on macOS, the flat bundle on iOS),
      # carrying the release version that apple/project.yml's
      # MARKETING_VERSION line holds.
      - name: Both appexes carry the extension at the release version
        run: |
          set -euo pipefail
          MARKETING_VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' apple/project.yml)
          if [ -z "$MARKETING_VERSION" ]; then
            echo "::error::No MARKETING_VERSION line in apple/project.yml" >&2
            exit 1
          fi
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products"
          for manifest in \
            "$PRODUCTS/Debug/ContextMint Bridge.app/Contents/PlugIns/ContextMintBridgeExtension.appex/Contents/Resources/manifest.json" \
            "$PRODUCTS/Debug-iphonesimulator/ContextMint Bridge.app/PlugIns/ContextMintBridgeExtension.appex/manifest.json"; do
            if [ ! -f "$manifest" ]; then
              echo "::error::Missing $manifest" >&2
              exit 1
            fi
            VERSION=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$manifest")
            if [ "$VERSION" != "$MARKETING_VERSION" ]; then
              echo "::error::$manifest is version $VERSION, MARKETING_VERSION is $MARKETING_VERSION" >&2
              exit 1
            fi
            echo "ok: $manifest ($VERSION)"
          done

      - name: Remove this job's DerivedData
        if: always()
        run: rm -rf "$RUNNER_TEMP/DerivedData" apple/ContextMintBridge.xcodeproj || true
