name: release-please

# Thin stub: release-please itself runs in chrischall/workflows'
# reusable-release-please.yml. What stays here is what depends on this repo:
# building both browser targets from the release tag and attaching four
# assets to the GitHub Release:
#
#   contextmint-bridge-chrome-${VERSION}.zip   + .sha256
#   contextmint-bridge-safari-${VERSION}.zip   + .sha256
#
# The Safari zip is a CONTRACT, not just a download: nullnet-app/mcp-host-app
# (its plan 2026-09-25-contextmint-mac-v0, Task 6) fetches
#   https://github.com/nullnet-app/contextmint-bridge/releases/download/v${VERSION}/contextmint-bridge-safari-${VERSION}.zip
# unauthenticated, checks it against a pinned SHA-256 and unzips it straight
# into its appex's Resources/. The `v`-prefixed tag (`include-v-in-tag`) and
# that asset name are the contract; tests/release-workflow.test.ts pins both.
#
# Nothing in this repo is published to npm — every workspace is `private`,
# and tests/release-workflow.test.ts fails if any workflow grows an
# `npm publish`. After the attach, the `chrome-web-store` job uploads the
# Release's own Chrome zip (never a rebuild) to the Chrome Web Store and
# submits it for review; it skips green until the owner has configured it
# (docs/RELEASING.md). The App Store side is deploy-safari-app.yml.
#
# A green tag does not mean the zips are attached, or that Chrome has the
# release: the jobs are independent. Check the Release's assets and the
# chrome-web-store job's notices; to finish a release whose tag exists but
# whose zips never (or only partly) attached, or whose store upload failed,
# dispatch this workflow FROM MAIN with `republish_tag`. Each job leaves what
# is already done alone.

on:
  push:
    branches: [main]
  # `republish_tag` re-fires the attach and Chrome Web Store jobs for a tag
  # that ALREADY EXISTS — for a release whose tag and GitHub Release were cut
  # but whose zips never (or only partly) attached, or whose store upload
  # failed. Blank on the ordinary path. It lives here rather than in the
  # reusable workflow because a called workflow cannot declare its caller's
  # triggers.
  workflow_dispatch:
    inputs:
      republish_tag:
        description: 'Existing tag to re-attach the extension zips to and re-submit to the Chrome Web Store (e.g. v1.0.0). Blank = skip.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: chrischall/workflows/.github/workflows/reusable-release-please.yml@main
    with:
      republish_tag: ${{ inputs.republish_tag }}
    secrets:
      release_pat: ${{ secrets.NULLNET_RELEASE_PAT }}

  attach-extension:
    needs: release-please
    # `publish`, NOT `release_created`: the latter is release-please's own
    # flag and is false on a republish, which is the one run that exists to
    # attach. The reusable workflow folds both paths into this one output.
    #
    # Bound to main: a `republish_tag` dispatch runs THIS file as it exists on
    # the dispatching ref, so without the guard a branch could rewrite this
    # job and upload whatever it liked to a published Release.
    if: needs.release-please.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `tag`, not `tag_name`: resolved ONCE for both paths by the
          # reusable workflow, and `tag_name` is empty on a republish where
          # only the dispatch input names the tag. The zip is built from the
          # tagged tree, never from whatever main has moved on to.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      # `--ignore-scripts`: this job can write to the Release, so no
      # transitive lifecycle script runs beside it. The lockfile carries
      # esbuild's platform binary as an optional package, so the build below
      # does not need esbuild's postinstall.
      - run: npm ci --ignore-scripts

      # The plain (release) build: no sourcemaps. `build.ts` makes release the
      # default precisely because this is the build that gets zipped.
      - name: Build Chrome extension
        run: npm run build --workspace=@fetchproxy/extension-chrome

      # VERSION = the release tag with its `v` stripped, already derived and
      # validated by the reusable workflow. It rides in `env:` rather than
      # being interpolated into the script, because a `${{ }}` value is
      # substituted before the shell parses anything.
      #
      # The manifest check is the "green tag is not a green publish" guard for
      # this repo: release-please bumps manifest.json through `extra-files`,
      # and a zip whose manifest disagrees with its tag would be rejected by
      # the Chrome Web Store (or, worse, accepted as the wrong version).
      - name: Package Chrome extension
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(node -p "require('./packages/extension-chrome/dist/manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::packages/extension-chrome/dist/manifest.json is ${MANIFEST_VERSION} but the release is ${VERSION}; refusing to zip." >&2
            exit 1
          fi
          cd packages/extension-chrome/dist
          zip -r "../../../contextmint-bridge-chrome-${VERSION}.zip" .
          ls -la "../../../contextmint-bridge-chrome-${VERSION}.zip"

      # A tag that predates packages/extension-safari (v1.0.0) has no Safari
      # package, and a `republish_tag` of it must still attach Chrome. This is
      # the ONLY reason the Safari steps may be skipped: the decision is made
      # once, here, from the checked-out tag, and every other failure of a
      # Safari step fails the job before anything is uploaded.
      - name: Detect Safari package
        id: safari
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if test -f packages/extension-safari/package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${RELEASE_TAG} predates packages/extension-safari; attaching the Chrome pair only."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Release build, as for Chrome. The Safari build generates its manifest
      # from extension-chrome/manifest.json, so it carries the same version.
      - name: Build Safari extension
        if: steps.safari.outputs.present == 'true'
        run: npm run build --workspace=@fetchproxy/extension-safari

      # Same version guard as Chrome's. The zip is made from INSIDE dist/ so
      # manifest.json sits at the zip root: mcp-host-app unzips this straight
      # into its appex's Contents/Resources/, and Safari only finds a web
      # extension whose manifest.json is at the top of Resources/ — a
      # `dist/manifest.json` entry would build an appex with no extension in it.
      - name: Package Safari extension
        if: steps.safari.outputs.present == 'true'
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(node -p "require('./packages/extension-safari/dist/manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::packages/extension-safari/dist/manifest.json is ${MANIFEST_VERSION} but the release is ${VERSION}; refusing to zip." >&2
            exit 1
          fi
          cd packages/extension-safari/dist
          zip -r "../../../contextmint-bridge-safari-${VERSION}.zip" .
          ls -la "../../../contextmint-bridge-safari-${VERSION}.zip"

      # release-please already created the GitHub Release with the CHANGELOG
      # body. Attach each extension zip and a digest of it: the zip is the
      # sideload / audit distribution path (and, for Safari, what
      # mcp-host-app pins), so the release has to say which bytes it
      # published, and a sideloader checks what they downloaded with one
      # `sha256sum -c` (hence sha256sum's own format).
      #
      # This runs only after BOTH targets built and passed their version
      # check, so a Safari failure uploads nothing at all. The per-zip logic
      # below is the same for every target; `attach` is called once each.
      #
      # NO `--clobber`: a published asset is what somebody already downloaded
      # and checked, and `republish_tag` lets any account with write access
      # re-run this job against an existing tag with a rebuilt zip. An asset
      # that is already there is left alone and reported.
      #
      # Which is exactly why the digest is computed HERE, from whichever zip
      # the release ends up carrying, rather than from the local rebuild. The
      # zip is NOT byte-reproducible — `zip -r` stores each entry's mtime and a
      # fresh checkout stamps every file with checkout time — so on the
      # republish path, where the upload is skipped, a digest of the rebuild
      # would describe bytes nobody can download: the sideloader who runs
      # `sha256sum -c` reads FAILED, which is indistinguishable from
      # tampering. The published zip is downloaded and hashed instead, so the
      # two assets always describe each other.
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          SAFARI: ${{ steps.safari.outputs.present }}
        run: |
          set -euo pipefail
          # An empty or unexpected value means the detect step did not run as
          # written; never treat that as "no Safari package".
          case "$SAFARI" in
            true) TARGETS=(chrome safari) ;;
            false) TARGETS=(chrome) ;;
            *) echo "::error::Safari detection reported '${SAFARI}', expected true or false." >&2; exit 1 ;;
          esac
          EXISTING=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          has_asset() { printf '%s\n' "$EXISTING" | grep -qxF "$1"; }

          # The one combination that cannot be repaired without overwriting
          # something: a digest whose zip has been deleted by hand. Uploading
          # a fresh zip under it would leave the release asserting a digest of
          # bytes it no longer serves, so refuse BEFORE uploading anything —
          # for EVERY target, so a lone Safari digest also stops the Chrome
          # upload — and name the repair.
          for target in "${TARGETS[@]}"; do
            ZIP="contextmint-bridge-${target}-${VERSION}.zip"
            DIGEST="${ZIP}.sha256"
            if has_asset "$DIGEST" && ! has_asset "$ZIP"; then
              echo "Release ${RELEASE_TAG} carries ${DIGEST} but not ${ZIP}: the published" >&2
              echo "digest describes bytes the release no longer serves, and this job never" >&2
              echo "overwrites an asset. Delete ${DIGEST} from the release, then re-run." >&2
              exit 1
            fi
          done

          attach() {
            local ZIP="contextmint-bridge-${1}-${VERSION}.zip"
            local DIGEST="${ZIP}.sha256"

            if has_asset "$ZIP"; then
              echo "Release ${RELEASE_TAG} already carries ${ZIP} — leaving it alone."
              # Hash what the release serves, never this run's rebuild.
              rm -f "$ZIP"
              gh release download "$RELEASE_TAG" --pattern "$ZIP" --dir .
            else
              gh release upload "$RELEASE_TAG" "$ZIP"
            fi

            if has_asset "$DIGEST"; then
              echo "Release ${RELEASE_TAG} already carries ${DIGEST} — leaving it alone."
            else
              sha256sum "$ZIP" > "$DIGEST"
              cat "$DIGEST"
              gh release upload "$RELEASE_TAG" "$DIGEST"
            fi
          }

          # Partial failure: if an upload fails part-way (say the Chrome pair
          # attached and the Safari zip did not), the job goes red. Dispatch
          # this workflow FROM MAIN with `republish_tag` to finish it: the
          # Chrome assets already there are left alone (and its digest still
          # describes the published zip), and the missing Safari pair is added.
          for target in "${TARGETS[@]}"; do
            attach "$target"
          done

  # Uploads the release's Chrome zip to the Chrome Web Store and submits it
  # for review, through the v2 API
  # (https://developer.chrome.com/docs/webstore/api, which supports service
  # accounts). The one-time owner setup is docs/RELEASING.md §Chrome Web Store.
  #
  # The EXACT bytes the release serves: the zip is downloaded from the Release
  # and checked against its published .sha256, never rebuilt (attach-extension
  # explains why a rebuild is not the same zip). So this job checks nothing
  # out and installs nothing.
  #
  # Same guard as attach-extension, for the same reason: `publish` covers the
  # tag path AND a `republish_tag` dispatch, so a failed store upload is
  # retried by dispatching this workflow FROM MAIN with the tag. attach-extension
  # leaves the assets alone on that run, and this job finds where the store
  # stands before doing anything (below).
  #
  # Auth is Workload Identity Federation: GitHub's OIDC token is exchanged for
  # a short-lived access token of the service account the Chrome Web Store
  # publisher has linked, scoped to the Chrome Web Store. No long-lived key or
  # refresh token exists anywhere. Every identifier is a repo VARIABLE (none is
  # a secret); until all four are set the job skips green with a notice, so a
  # release before the owner's setup does not go red.
  chrome-web-store:
    needs: [release-please, attach-extension]
    if: needs.release-please.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
    steps:
      - name: Check the Chrome Web Store configuration
        id: config
        env:
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          for name in CWS_PUBLISHER_ID CWS_ITEM_ID CWS_WORKLOAD_IDENTITY_PROVIDER CWS_SERVICE_ACCOUNT; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Chrome Web Store upload skipped: set the repo variable(s) ${missing[*]} (one-time setup: docs/RELEASING.md, Chrome Web Store). Then dispatch this workflow from main with republish_tag to submit this release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The asset and its digest as the Release serves them; `sha256sum -c`
      # fails the job on any mismatch before a byte reaches the store.
      - name: Download the release's Chrome zip
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP="contextmint-bridge-chrome-${VERSION}.zip"
          gh release download "$RELEASE_TAG" --pattern "$ZIP" --pattern "$ZIP.sha256" --dir .
          sha256sum -c "$ZIP.sha256"

      # The access token is masked by the action, lives one hour at most, and
      # carries only the Chrome Web Store scope. No credentials file is written.
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      # fetchStatus first, so a re-run is a no-op: this version already
      # published, newer in the store, or already submitted (PENDING_REVIEW /
      # STAGED) is a notice. ANOTHER version in review or staged is a warning
      # and nothing more: the store takes one submission at a time, and this
      # job never cancels one (no cancelSubmission, rollback or skipReview
      # anywhere). Otherwise: upload (polling while the store reports
      # IN_PROGRESS), then publish with DEFAULT_PUBLISH, which submits for
      # review and publishes on approval. Any non-2xx fails the job with
      # Google's own message.
      #
      # The bearer token goes to curl from a 0600 header file (`-H @file`), so
      # it is never on a command line or in the log, and the file is removed
      # on exit.
      - name: Upload to the Chrome Web Store and submit for review
        if: steps.config.outputs.ready == 'true'
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION: ${{ needs.release-please.outputs.version }}
          POLL_SECONDS: "10"
          POLL_LIMIT: "60"
        run: |
          set -euo pipefail
          API="https://chromewebstore.googleapis.com"
          ITEM="publishers/${CWS_PUBLISHER_ID}/items/${CWS_ITEM_ID}"
          ZIP="contextmint-bridge-chrome-${VERSION}.zip"
          AUTH="$RUNNER_TEMP/cws-auth-header"
          RESP="$(mktemp -d)"
          trap 'rm -rf "$AUTH" "$RESP"' EXIT
          (umask 077; printf 'Authorization: Bearer %s\n' "$CWS_TOKEN" > "$AUTH")
          unset CWS_TOKEN

          # api METHOD URL OUT [curl args…]: the answer in OUT; any non-2xx
          # (or no answer) fails the job with Google's message.
          api() {
            local method="$1" url="$2" out="$3" code msg
            shift 3
            if ! code=$(curl -sS -X "$method" -H "@$AUTH" -o "$out" -w '%{http_code}' "$@" "$url"); then
              echo "::error::Chrome Web Store ${method} ${url#"$API"} got no answer."
              exit 1
            fi
            case "$code" in
              2??) ;;
              *)
                msg=$(jq -r '.error.message // empty' "$out" 2>/dev/null || true)
                echo "::error::Chrome Web Store ${method} ${url#"$API"} answered HTTP ${code}: ${msg:-$(head -c 2000 "$out")}"
                exit 1
                ;;
            esac
          }
          # newer A B: A is a later version than B.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          api GET "$API/v2/$ITEM:fetchStatus" "$RESP/status.json"
          PUBLISHED=$(jq -r '[.publishedItemRevisionStatus.distributionChannels[]?.crxVersion] | .[0] // empty' "$RESP/status.json")
          SUBMITTED_STATE=$(jq -r '.submittedItemRevisionStatus.state // empty' "$RESP/status.json")
          SUBMITTED=$(jq -r '[.submittedItemRevisionStatus.distributionChannels[]?.crxVersion] | .[0] // empty' "$RESP/status.json")
          echo "Chrome Web Store: published ${PUBLISHED:-none}; submitted ${SUBMITTED:-none} ${SUBMITTED_STATE}"

          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "::notice::Chrome Web Store already publishes ${VERSION}; nothing to upload."
            exit 0
          fi
          if [ -n "$PUBLISHED" ] && newer "$PUBLISHED" "$VERSION"; then
            echo "::notice::Chrome Web Store already publishes ${PUBLISHED}, newer than ${VERSION}; nothing to upload."
            exit 0
          fi
          case "$SUBMITTED_STATE" in
            PENDING_REVIEW|STAGED)
              if [ "$SUBMITTED" = "$VERSION" ]; then
                echo "::notice::Chrome Web Store already has ${VERSION} ${SUBMITTED_STATE}; nothing to upload."
                exit 0
              fi
              echo "::warning::Chrome Web Store: ${VERSION} was not uploaded, because ${SUBMITTED:-another version} is ${SUBMITTED_STATE} and the store takes one submission at a time. This job never cancels a submission. Once that one is published (or rejected or cancelled in the Developer Dashboard), dispatch this workflow from main with republish_tag=v${VERSION}."
              exit 0
              ;;
          esac

          api POST "$API/upload/v2/$ITEM:upload" "$RESP/upload.json" \
            -H 'Content-Type: application/zip' -T "$ZIP"
          STATE=$(jq -r '.uploadState // empty' "$RESP/upload.json")
          # LAST is the newest answer about this upload: the :upload reply, or
          # the latest fetchStatus poll once the upload went async. The state,
          # the version check and the failure message all read from it, so an
          # upload that finishes later is checked exactly like one that
          # finishes at once.
          LAST="$RESP/upload.json"
          polls=0
          while [ "$STATE" = IN_PROGRESS ] || [ "$STATE" = UPLOAD_IN_PROGRESS ]; do
            if [ "$polls" -ge "$POLL_LIMIT" ]; then
              echo "::error::Chrome Web Store upload of ${VERSION} is still IN_PROGRESS after ${polls} checks; not submitting. Re-run with republish_tag=v${VERSION} once the Developer Dashboard shows the package."
              exit 1
            fi
            polls=$((polls + 1))
            sleep "$POLL_SECONDS"
            api GET "$API/v2/$ITEM:fetchStatus" "$RESP/poll.json"
            LAST="$RESP/poll.json"
            STATE=$(jq -r '.lastAsyncUploadState // empty' "$LAST")
          done
          if [ "$STATE" != SUCCEEDED ]; then
            echo "::error::Chrome Web Store upload of ${VERSION} ended ${STATE:-without a state}: $(head -c 2000 "$LAST")"
            exit 1
          fi
          CRX=$(jq -r '.crxVersion // empty' "$LAST")
          if [ -z "$CRX" ]; then
            # Not a failure: attach-extension already refused to zip a
            # manifest whose version is not the release's, and the zip was
            # checked against the release's .sha256 above. Say it, though —
            # silence here reads as "the store confirmed the version".
            echo "::notice::Chrome Web Store did not report the uploaded version; relying on the release's own manifest check for ${VERSION}."
          elif [ "$CRX" != "$VERSION" ]; then
            echo "::error::Chrome Web Store read version ${CRX} from ${ZIP}, not ${VERSION}; not submitting."
            exit 1
          fi

          api POST "$API/v2/$ITEM:publish" "$RESP/publish.json" \
            -H 'Content-Type: application/json' --data '{"publishType":"DEFAULT_PUBLISH"}'
          jq -r '.warningInfo.warnings[]? | "::warning::Chrome Web Store: \(.reason): \(.description)"' "$RESP/publish.json"
          RESULT=$(jq -r '.state // empty' "$RESP/publish.json")
          echo "::notice::Chrome Web Store: ${VERSION} uploaded and submitted for review (${RESULT:-state not reported}); it publishes on approval."
          {
            echo "## Chrome Web Store"
            echo
            echo "**${VERSION}** uploaded and submitted for review: ${RESULT:-state not reported}."
          } >> "$GITHUB_STEP_SUMMARY"
